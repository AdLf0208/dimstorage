[mod]
id = "dimstorage"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The content half is inside this bundle (`data/dimstorage-content.hmod`, the
# built `content/dimstorage.hmod`): this writes it to `.horizon-cache/` and
# appends it to the dev-mod list, so one `.hnmod` installs the chest and the
# code. The registry keeps one file per project, so a split port could not be
# listed; AE2 ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# The pure frequency store and its merge (standalone crate lib, injected as
# `crate::game::dimstorage`).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "dimstorage"
source = "runtime.rs"

# Game-side glue: the block entity, the store file, the container and the
# commands.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "dimstorage_state"
source = "support.rs"

# The chest block declares a block entity.
[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "entity" },
]

# ... and ticks.
[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "ticks" },
]

# ... with 54 slots and the vanilla 9x6 menu.
[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "container" },
]

# Each tick: mirror the frequency's store into the chest's slots.
[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "entity" },
]

# A broken chest keeps its contents (the store has them).
[[injection]]
id = "destroy-block"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "destroy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "canceled", ty = "&mut bool", value = "canceled" },
]

# A blown-up chest must not spill a second copy of the store.
[[injection]]
id = "explosion-detonate"
hook = "explosion_detonate"
hook_version = 1
kind = "HEAD"
helper = "explosion.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "blocks", ty = "&mut Vec<[i32; 3]>", value = "blocks" },
]

# The world opened/closed: load/save the frequency store.
[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "world.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "WorldPhase", value = "phase" },
]

# End of a running tick: debounce the store write.
[[injection]]
id = "server-tick"
hook = "server_tick"
hook_version = 1
kind = "HEAD"
helper = "server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "ServerTickPhase", value = "phase" },
]

# Stopping: flush the store.
[[injection]]
id = "stopping"
hook = "server_stopping"
hook_version = 1
kind = "HEAD"
helper = "stopping.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# `/dimstorage channel|info`.
[[injection]]
id = "register-commands"
hook = "register_commands"
hook_version = 1
kind = "HEAD"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<NativeCommand>", value = "commands" },
]

[[injection]]
id = "perform-command"
hook = "perform_command"
hook_version = 1
kind = "HEAD"
helper = "perform.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "ran" },
]
