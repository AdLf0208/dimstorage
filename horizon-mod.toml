id = "dimstorage"
name = "DimStorage"
version = "0.2.3"
description = """A port of DimStorage for Horizon: the dimensional chest and the dimensional tank.
Every chest on the same public frequency (default public / 1) shows the same 54 slots in any
dimension, opened through the vanilla 9x6 menu, and every tank on a channel holds the same 16,000 mB
of fluid, filled and drained with buckets; both stores are world-global and persisted in
<world>/dimstorage/. /dimstorage channel|info|put|take are the headless fallbacks for the deferred
frequency screen. The tablet, the owner/lock/frequency screen, the custom renderer, the tank's screen
and comparator and the remaining cosmetics are not ported yet."""
authors = ["Edivad99", "AdLf0208"]
# The original's licence: AGPL-3.0-only (Edivad99/DimStorage); its text and the provenance notice
# travel inside the package as LICENSE / LICENSE-NOTICE.md.
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside
# data/ and assets/. The id is the resource namespace and the only identity.
api = "0.2"
# The installation side, not the hook's: the store and the block entity run on the server, and single
# player's integrated server belongs to the client installation, so "both".
side = "both"
# The one shared value every manifest carries ("May add blocks, items, mob effects and entity types"):
# this package declares the dimensional chest block and its item through the carried content.
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
